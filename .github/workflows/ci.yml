name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: netslet_stageb_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d netslet_stageb_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/netslet_stageb_ci?schema=public
      STAGE_A_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/netslet_stageb_ci?schema=public
      REDIS_URL: redis://localhost:6379
      WEB_ORIGIN: http://127.0.0.1:3000
      WEB_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:4000/api/v1
      STAGE_B_CI: '1'
      STAGE_B_CBT_E2E: '1'
      COLD_START_QA: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install reproducibly
        run: pnpm install --frozen-lockfile
      - name: Generate database client
        run: pnpm db:generate
      - name: Apply database migrations
        run: pnpm --filter @net-slet/api exec prisma migrate deploy --config ../../recovery/stage-a/prisma.config.ts
      - name: Validate workspace
        run: pnpm verify:structure
      - name: Type-check
        run: pnpm typecheck
      - name: Run unit tests
        run: pnpm test
      - name: Lint
        run: pnpm lint
      - name: Build all
        run: pnpm build
      - name: Database integration checks
        run: pnpm test:integration
      - name: Start API for authenticated historical PYQ acceptance
        run: |
          nohup pnpm --filter @net-slet/api start > /tmp/netslet-api.log 2>&1 &
          echo $! > /tmp/netslet-api.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4000/api/v1/health/ready > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/netslet-api.log
          exit 1
      - name: Authenticated historical PYQ HTTP acceptance
        env:
          HISTORICAL_PYQ_HTTP_ACCEPTANCE: '1'
        run: pnpm test:historical-pyq:http
      - name: Stop API after authenticated acceptance
        if: always()
        run: if [ -f /tmp/netslet-api.pid ]; then kill "$(cat /tmp/netslet-api.pid)" || true; fi
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser journeys (Stage B, Sprint 1 and preview safety)
        run: pnpm exec playwright test tests/e2e/sprint1.spec.ts tests/e2e/sprint3b-preview.spec.ts tests/e2e/stage-b-cbt.spec.ts
      - name: Browser journeys (Sprint 2 acceptance)
        env:
          STAGE_B_CBT_E2E: ''
        run: pnpm exec playwright test tests/e2e/sprint2-acceptance.spec.ts
      - name: Browser journeys (Release 1 PYQ governance and student acceptance)
        env:
          STAGE_B_CBT_E2E: ''
        run: pnpm exec playwright test tests/e2e/sprint9-pyq-acceptance.spec.ts
